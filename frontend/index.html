<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Charging Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ── Login Screen ─────────────────────────────────────────────── -->
<div id="login-screen">

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-icon">🔋</div>
      <h1>ChargeTrack</h1>
      <p>Phone Charging Management System</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="
        this.classList.add('active');
        document.getElementById('tab-register').classList.remove('active');
        document.getElementById('panel-login').classList.remove('hidden');
        document.getElementById('panel-register').classList.add('hidden');
      ">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="
        this.classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('panel-register').classList.remove('hidden');
        document.getElementById('panel-login').classList.add('hidden');
      ">Create Account</button>
    </div>

    <!-- Login Panel -->
    <div id="panel-login">
      <div id="login-error" class="alert alert-error hidden"></div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" autocomplete="username" placeholder="Enter your username" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
        </div>
        <button class="btn btn-primary btn-full btn-lg" type="submit">Sign In →</button>
      </form>
      <p style="text-align:center;font-size:.83rem;color:var(--text-muted);margin-top:1rem">
        New here?
        <button id="show-register-btn" style="background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:.83rem;font-family:inherit">Create an account</button>
      </p>
    </div>

    <!-- Register Panel -->
    <div id="panel-register" class="hidden">
      <div id="register-error"   class="alert alert-error   hidden"></div>
      <div id="register-success" class="alert alert-success hidden"></div>
      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="reg-displayname">Full Name</label>
          <input id="reg-displayname" type="text" placeholder="e.g. John Doe" required />
        </div>
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input id="reg-username" type="text" placeholder="Choose a username" autocomplete="off" required />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required />
        </div>
        <div class="form-group">
          <label for="reg-password2">Confirm Password</label>
          <input id="reg-password2" type="password" placeholder="Repeat password" autocomplete="new-password" required />
        </div>
        <button class="btn btn-primary btn-full btn-lg" type="submit">Create Account →</button>
      </form>
      <p style="text-align:center;font-size:.83rem;color:var(--text-muted);margin-top:1rem">
        Already have an account?
        <button id="show-login-btn" style="background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:.83rem;font-family:inherit">Sign in</button>
      </p>
    </div>
  </div>

</div>

<!-- ── Main App ──────────────────────────────────────────────────── -->
<div id="app" class="hidden">

  <header>
    <div class="header-brand">
      <div class="brand-icon">🔋</div>
      ChargeTrack
    </div>
    <div id="nav-links">
      <button data-screen="dashboard" id="nav-dashboard">Dashboard</button>
      <button data-screen="intake"    id="nav-intake">New Intake</button>
      <button data-screen="search"    id="nav-search">Search / Collect</button>
      <button data-screen="history"   id="nav-history">History</button>
      <button data-screen="staff"     id="nav-staff" class="hidden">Staff</button>
      <button id="nav-logout">Sign Out</button>
    </div>
    <div class="header-user">
      <div class="user-avatar" id="user-avatar">?</div>
      <span id="staff-display"></span>
    </div>
  </header>

  <main>
    <!-- Dashboard -->
    <div id="screen-dashboard" class="screen hidden"></div>

    <!-- New Intake -->
    <div id="screen-intake" class="screen hidden"></div>

    <!-- Search / Collection -->
    <div id="screen-search" class="screen hidden"></div>

    <!-- History -->
    <div id="screen-history" class="screen hidden"></div>

    <!-- Staff Management (owner only) -->
    <div id="screen-staff" class="screen hidden"></div>
  </main>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>

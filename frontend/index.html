<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Charging Tracker</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<!-- ── Login Screen ─────────────────────────────────────────────── -->
<div id="login-screen">

  <!-- Login Panel -->
  <div class="login-card" id="panel-login">
    <h1>🔋 Charging Tracker</h1>
    <p>Sign in to manage charging jobs</p>
    <div id="login-error" class="alert alert-error hidden"></div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" autocomplete="username" placeholder="Username" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" required />
      </div>
      <button class="btn btn-primary btn-full" type="submit">Sign In</button>
    </form>
    <hr class="divider" />
    <p style="text-align:center;font-size:.88rem;color:var(--neutral-600)">
      New staff member?
      <button class="btn btn-secondary btn-sm" id="show-register-btn" style="margin-left:.4rem">Create Account</button>
    </p>
  </div>

  <!-- Register Panel -->
  <div class="login-card hidden" id="panel-register">
    <h1>🔋 Create Account</h1>
    <p>Request a staff account. An owner will activate it.</p>
    <div id="register-error"   class="alert alert-error   hidden"></div>
    <div id="register-success" class="alert alert-success hidden"></div>
    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="reg-displayname">Full Name *</label>
        <input id="reg-displayname" type="text" placeholder="e.g. John Doe" required />
      </div>
      <div class="form-group">
        <label for="reg-username">Username *</label>
        <input id="reg-username" type="text" placeholder="Choose a username" autocomplete="off" required />
      </div>
      <div class="form-group">
        <label for="reg-password">Password *</label>
        <input id="reg-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required />
      </div>
      <div class="form-group">
        <label for="reg-password2">Confirm Password *</label>
        <input id="reg-password2" type="password" placeholder="Repeat password" autocomplete="new-password" required />
      </div>
      <button class="btn btn-primary btn-full" type="submit">Register</button>
    </form>
    <hr class="divider" />
    <p style="text-align:center;font-size:.88rem;color:var(--neutral-600)">
      Already have an account?
      <button class="btn btn-secondary btn-sm" id="show-login-btn" style="margin-left:.4rem">Sign In</button>
    </p>
  </div>

</div>

<!-- ── Main App ──────────────────────────────────────────────────── -->
<div id="app" class="hidden">

  <header>
    <h1>🔋 Phone Charging Tracker</h1>
    <div id="nav-links">
      <button data-screen="dashboard" id="nav-dashboard">Dashboard</button>
      <button data-screen="intake"    id="nav-intake">New Intake</button>
      <button data-screen="search"    id="nav-search">Search / Collect</button>
      <button data-screen="history"   id="nav-history">History</button>
      <button data-screen="staff"     id="nav-staff"  class="hidden">Staff</button>
      <button id="nav-logout">Sign Out</button>
    </div>
    <div id="staff-info">
      <span id="staff-display"></span>
    </div>
  </header>

  <main>
    <!-- Dashboard -->
    <div id="screen-dashboard" class="screen hidden"></div>

    <!-- New Intake -->
    <div id="screen-intake" class="screen hidden"></div>

    <!-- Search / Collection -->
    <div id="screen-search" class="screen hidden"></div>

    <!-- History -->
    <div id="screen-history" class="screen hidden"></div>

    <!-- Staff Management (owner only) -->
    <div id="screen-staff" class="screen hidden"></div>
  </main>

</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
